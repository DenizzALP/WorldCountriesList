<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="input-container">
        <h1 class="big-title">WORLD COUNTRIES LIST</h1>
        <h2 class="small-title">Total Number of countries: 193</h2>
        <p class="info-title"></p>
        <div class="buttons">
            <button id="start-btn">STARTING WORD</button>
            <button id="contatin-btn">SEARCH WITH ANY WORD</button>
            <button id="arrange-btn">A-Z</button>
        </div>
        <div class="search">
            <input type="text" id="search-input" placeholder="Search Country...">
            <button id="search-btn"><i class="fa fa-search" id="icon"></i></button>
        </div>
    </div>
    <div class="output-container">
        <div class="box-container">
        </div>
    </div>

    <script src="./countries.js"></script>
    <script src="./script.js"></script>
</body>
</html>
